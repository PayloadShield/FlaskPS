[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-payloadshield"
version = "1.0.1"
description = "Pluggable Flask decorators for encrypting/decrypting request and response payloads"
readme = "README.md"
requires-python = ">=3.7"
license = "Apache-2.0"
authors = [
    {name = "Ganesh Kandu", email = "kanduganesh@gmail.com"},
]
keywords = ["flask", "base64", "crypto", "encryption", "decorator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Flask",
]

dependencies = [
    "Flask>=2.0.0",
    "compyps>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[project.urls]
Homepage = "https://pypi.org/project/flask-payloadshield/"
Repository = "https://github.com/PayloadShield/FlaskPS"
Issues = "https://github.com/PayloadShield/FlaskPS/issues"

[tool.setuptools]
packages = ["flask_payloadshield"]

[tool.setuptools.package-data]
flask_payloadshield = ["py.typed"]
